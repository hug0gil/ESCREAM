<header class="header">
  <div class="logo">
    <img src="assets/img/LogoTransparenteESCREAM.png" alt="ESCREAM Logo" (click)="onLogoClick()">
    <span class="es">ES</span>
    <span class="cream">CREAM</span>
  </div>

  @if (showSearch()) {
  <div class="header-search">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
    </svg>
    <input type="text" [formControl]="searchControl" placeholder="Buscar películas..." />
    <button type="button" class="filter-toggle" (click)="toggleFilter()" aria-label="Búsqueda avanzada"
      title="Búsqueda avanzada">⛭</button>
  </div>
  }

  <nav class="nav-links">
    <a routerLink="/movies" class="pillLink">Catálogo</a>
    <a routerLink="/plans" class="pillLink">Planes</a>

    @if (auth.isAuthenticated()) {
    <div class="user-menu">
      <button class="avatar-btn" (click)="toggleMenu()" [attr.aria-expanded]="menuOpen()">
        {{ profileService.activeProfile()?.profileName?.charAt(0)?.toUpperCase() }}
      </button>


      <!-- Añadir cambio de profile -->
      @if (menuOpen()) {
      <div class="dropdown">
        <div class="dropdown-header">
          <p class="dropdown-name">{{ profileService.activeProfile()?.profileName }}</p>
          <p class="dropdown-email">{{ auth.currentUser()?.email }}</p>
        </div>

        <div class="dropdown-section">
          <button class="dropdown-item" (click)="go('/dashboard')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
              <circle cx="12" cy="8" r="4" />
              <path d="M4 20c0-4 3.6-7 8-7s8 3 8 7" />
            </svg>
            Editar perfil
          </button>

          <button class="dropdown-item profiles" (click)="go('/profiles')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">

              <path d="M17 3h4v4" />
              <path d="M21 3l-5 5" />

              <circle cx="9" cy="8" r="4" />
              <path d="M3 21c0-3.5 2.7-6 6-6s6 2.5 6 6" />
            </svg>
            Cambiar perfil
          </button>

          @if (auth.canEdit()) {
          <button class="dropdown-item admin" (click)="go('/admin-dashboard')">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M12 2L4 6v6c0 5 3.5 9.3 8 10.5C16.5 21.3 20 17 20 12V6L12 2z" />
            </svg>
            Panel de {{auth.currentUser()?.role?.toLowerCase()}}
          </button>
          }
        </div>

        <hr class="dropdown-divider">

        <div class="dropdown-section">
          <button class="dropdown-item danger" (click)="auth.logout()">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
              stroke-linejoin="round">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            Cerrar sesión
          </button>
        </div>
      </div>
      }
    </div>
    } @else if (auth.hasSelectedProfile()) {
    <a routerLink="/browse" class="pillLogin">
      <img src="assets/img/profileLogo.svg" alt="Perfil">
    </a>
    }
    @else {
    <a routerLink="/login" class="pillLogin">
      <img src="assets/img/profileLogo.svg" alt="Perfil">
    </a>
    }
  </nav>
</header>
