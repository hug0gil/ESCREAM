<header class="header">
  <div class="logo">
    <img src="assets/img/LogoTransparenteESCREAM.png" alt="ESCREAM Logo" routerLink="/" (click)="onClickLink('/')">
    <span class="es">ES</span>
    <span class="cream">CREAM</span>
  </div>

  @if (showSearch()) {
  <div class="header-search">
    <svg class="search-icon" viewBox="0 0 24 24" aria-hidden="true" fill="none" stroke="currentColor" stroke-width="2.2"
      stroke-linecap="round" stroke-linejoin="round">
      <circle cx="11" cy="11" r="7"></circle>
      <line x1="16.5" y1="16.5" x2="21" y2="21"></line>
    </svg>
    <input type="text" [formControl]="searchControl" placeholder="Buscar películas..." />
    <button type="button" class="filter-toggle" (click)="toggleFilter()" aria-label="Búsqueda avanzada"
      title="Búsqueda avanzada">⛭</button>
  </div>
  }

  <nav class="nav-links">
    <a routerLink="/movies" class="pillLink">Catálogo</a>
    <a routerLink="/plans" class="pillLink">Planes</a>
    <a [routerLink]="auth.isAuthenticated() ? '/dashboard' : '/login'" class="pillLogin">
      <img src="assets/img/profileLogo.svg" alt="Profile Logo">
    </a>
  </nav>
</header>
