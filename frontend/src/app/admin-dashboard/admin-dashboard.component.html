<div class="administration">
    <!-- Tarjeta de administración (solo EDITOR / ADMIN) -->
    @if (auth.canEdit()) {
    <div class="admin-card">
        <h2>Acciones</h2>
        <div class="admin-grid">
            <button class="admin-btn" (click)="manage('peliculas')">
                <span class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="9" width="20" height="13" rx="1.5" />
                        <rect x="2" y="6" width="20" height="4" rx="1" />
                        <line x1="7" y1="6" x2="6" y2="10" />
                        <line x1="12" y1="6" x2="11" y2="10" />
                        <line x1="17" y1="6" x2="16" y2="10" />
                        <line x1="5" y1="15" x2="16" y2="15" />
                        <line x1="5" y1="18" x2="12" y2="18" />
                    </svg>
                </span>
                <span>Películas</span>
            </button>
            <button class="admin-btn" (click)="manage('reviews')">
                <span class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path
                            d="M21 11.5a8.38 8.38 0 0 1-.9 3.8 8.5 8.5 0 0 1-7.6 4.7 8.38 8.38 0 0 1-3.8-.9L3 21l1.9-5.7a8.38 8.38 0 0 1-.9-3.8 8.5 8.5 0 0 1 4.7-7.6 8.38 8.38 0 0 1 3.8-.9h.5a8.48 8.48 0 0 1 8 8v.5z" />
                    </svg>
                </span>
                <span>Reviews</span>
            </button>
            @if (auth.isAdmin()) {
            <button class="admin-btn" (click)="manage('subscripciones')">
                <span class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <rect x="2" y="5" width="20" height="14" rx="2" />
                        <line x1="2" y1="10" x2="22" y2="10" />
                    </svg>
                </span>
                <span>Suscripciones</span>
            </button>
            <button class="admin-btn" (click)="manage('usuarios')">
                <span class="icon">
                    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"
                        stroke-linejoin="round" aria-hidden="true">
                        <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" />
                        <circle cx="9" cy="7" r="4" />
                        <path d="M23 21v-2a4 4 0 0 0-3-3.87" />
                        <path d="M16 3.13a4 4 0 0 1 0 7.75" />
                    </svg>
                </span>
                <span>Usuarios</span>
            </button>
            }
        </div>
    </div>
    }
