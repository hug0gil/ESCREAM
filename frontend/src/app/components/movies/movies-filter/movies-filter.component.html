<form [formGroup]="form" (ngSubmit)="submit()">

    <div class="filters-container">
        <!-- SUBGÉNEROS -->
        <div class="filter-section">
            <div class="layout-container-dropdown" [class.open]="dropdownOpen['subgenres']">
                <label>Subgéneros</label>
                <button type="button" class="list-button" (click)="toggleDropdown('subgenres')">
                    {{ dropdownOpen['subgenres'] ? '-' : '+' }}
                </button>
            </div>
            <div class="chip-grid-subgenres" [class.open]="dropdownOpen['subgenres']">
                <button *ngFor="let s of subgenres()" type="button" class="chip"
                    [class.active]="isActive(s.id, subgenreIdsArray)"
                    [attr.aria-pressed]="isActive(s.id, subgenreIdsArray)"
                    (click)="toggleCheckbox(s.id, subgenreIdsArray)">
                    {{ s.name }}
                </button>
            </div>
        </div>

        <!-- PAÍSES -->
        <div class="filter-section">
            <div class="layout-container-dropdown" [class.open]="dropdownOpen['countries']">
                <label>Países</label>
                <button type="button" class="list-button" (click)="toggleDropdown('countries')">
                    {{ dropdownOpen['countries'] ? '-' : '+' }}
                </button>
            </div>
            <div class="chip-grid-countries" [class.open]="dropdownOpen['countries']">
                @for(c of countries(); track $index) {
                <button type="button" class="chip chip-country" [class.active]="isActive(c, countriesArray)"
                    [attr.aria-pressed]="isActive(c, countriesArray)" (click)="toggleCheckbox(c, countriesArray)">
                    <span>{{ c }}</span>
                    <img class="flag" [src]="'https://flagsapi.com/' + c + '/flat/32.png'" [alt]="c" />
                </button>
                }
            </div>
        </div>

        <!-- RANGO DE AÑOS -->
        <div class="filter-section">
            <div class="layout-container-dropdown" [class.open]="dropdownOpen['year']">
                <label>Años</label>
                <button type="button" class="list-button" (click)="toggleDropdown('year')">
                    {{ dropdownOpen['year'] ? '-' : '+' }}
                </button>
            </div>

            <!-- Contenedor del slider -->
            <div class="dropdown-content" [class.open]="dropdownOpen['year']">
                <div class="slider-wrapper">
                    <ngx-slider [value]="form.value.yearRange.min" [highValue]="form.value.yearRange.max"
                        (valueChange)="form.get('yearRange.min')?.setValue($event)"
                        (highValueChange)="form.get('yearRange.max')?.setValue($event)"
                        [options]="{ floor: yearRangeLimits().min, ceil: yearRangeLimits().max }">
                    </ngx-slider>
                </div>
            </div>
        </div>

        <!-- VALORACIÓN -->
        <div class="filter-section">
            <div class="layout-container-dropdown" [class.open]="dropdownOpen['rating']">
                <label>Valoración</label>
                <button type="button" class="list-button" (click)="toggleDropdown('rating')">
                    {{ dropdownOpen['rating'] ? '-' : '+' }}
                </button>
            </div>
            <div class="rating-stars" [class.open]="dropdownOpen['rating']">
                <div class="rating-track" (mouseleave)="hoverRating = 0">
                    @for (r of [1,2,3,4,5]; track r) {
                    <button type="button" class="rating-skull"
                        [class.filled]="hoverRating ? r <= hoverRating : r <= currentRating"
                        [class.dim]="hoverRating > 0 && r > hoverRating"
                        (mouseenter)="hoverRating = r" (click)="setRating(r)"
                        [attr.aria-label]="r + ' calaveras'"
                        [attr.aria-pressed]="r === currentRating">
                        <app-rating-skulls [rating]="1" />
                    </button>
                    }
                </div>
            </div>
        </div>
    </div>


    <!-- BOTONES -->
    <div class="filter-buttons-container">
        <button type="submit" class="filter-button">Aplicar filtros</button>
        <button type="button" class="clean-button" (click)="reset()">Limpiar</button>
    </div>

</form>
