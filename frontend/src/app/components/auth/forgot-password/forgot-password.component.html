<div class="logo">
    <img src="assets/img/LogoTransparenteESCREAM.png" alt="ESCREAM Logo" routerLink="/">
</div>

<div class="login">
    <div class="login-container">
        <form [formGroup]="form" (ngSubmit)="submit()">
            <h1>Cambiar contraseña</h1>

            <div class="form-group">
                <p>Correo electrónico:</p>
                <input type="text" formControlName="email" placeholder="ejemplo@correo.com">
                @if (form.get('email')?.invalid && submitted) {
                <p class="error-message">Introduce un correo válido.</p>
                }
            </div>

            @if (successMsg()) {
            <p class="success-message">{{ successMsg() }}</p>
            }

            @if (errorMsg()) {
            <p class="error-message">{{ errorMsg() }}</p>
            }

            <button type="submit" [disabled]="loading()">
                {{ loading() ? 'Enviando…' : 'Enviar instrucciones' }}
            </button>

            <div class="extra-links">
                <a routerLink="/login">Volver al login</a>
            </div>
        </form>
    </div>
</div>
